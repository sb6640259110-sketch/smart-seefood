<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Seafood Farm & Shop</title>
    
    <!-- โหลดไลบรารี React จาก CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* =========================================
           ส่วนที่ 1: ตกแต่งความสวยงาม (CSS Dark Mode)
           ========================================= */
        :root {
            --bg-main: #0a0d14;         
            --bg-card: #131823;         
            --accent-cyan: #26dec0;     
            --accent-gold: #ffd700;
            --text-main: #e2e8f0;       
            --text-muted: #8b949e;      
            --border-color: #263040;    
        }
        
        body { margin: 0; padding: 0; }
        .app-container { display: flex; min-height: 100vh; font-family: 'Segoe UI', Prompt, sans-serif; background-color: var(--bg-main); color: var(--text-main); }
        
        .sidebar { width: 260px; background-color: var(--bg-card); border-right: 1px solid var(--border-color); padding-top: 30px; display: flex; flex-direction: column; z-index: 10; }
        .sidebar h2 { text-align: center; margin-bottom: 40px; font-size: 1.4rem; color: var(--accent-cyan); }
        .menu-item { padding: 16px 24px; cursor: pointer; transition: 0.3s; font-size: 1.05rem; border-left: 4px solid transparent; color: var(--text-muted); }
        .menu-item:hover, .menu-item.active { background-color: rgba(38, 222, 192, 0.05); border-left: 4px solid var(--accent-cyan); color: var(--accent-cyan); }
        
        .main-content { flex: 1; padding: 40px; overflow-y: auto; }
        .section { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .header-title { font-size: 1.8rem; margin-bottom: 30px; border-bottom: 2px solid var(--border-color); padding-bottom: 15px; }
        
        .shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 30px; }
        .product-card { background: var(--bg-card); padding: 30px; border-radius: 16px; border: 1px solid var(--border-color); transition: 0.3s; }
        .product-card:hover { transform: translateY(-3px); border-color: rgba(38, 222, 192, 0.4); box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        .product-card h3 { margin-top: 0; color: var(--text-main); font-size: 1.3rem; margin-bottom: 5px; }
        .product-card p { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 25px; }
        
        /* การ์ดพิเศษสำหรับปลาเก๋ายักษ์ */
        .product-card.special-item {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.08) 0%, rgba(19, 24, 35, 1) 100%);
            border: 2px solid var(--accent-gold);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
        }
        .product-card.special-item:hover {
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.4);
            transform: translateY(-5px);
        }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--text-muted); }
        select, input[type="text"], input[type="number"], input[type="date"] { width: 100%; padding: 12px 15px; border: 1px solid var(--border-color); border-radius: 8px; box-sizing: border-box; font-size: 1rem; color: var(--text-main); background-color: var(--bg-main); color-scheme: dark; }
        select:focus, input:focus { outline: none; border-color: var(--accent-cyan); }
        
        button { background-color: rgba(38, 222, 192, 0.05); color: var(--accent-cyan); border: 1px solid var(--accent-cyan); padding: 14px 20px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; font-size: 1.05rem; transition: 0.2s; margin-top: 10px; }
        button:hover:not(:disabled) { background-color: var(--accent-cyan); color: #000; box-shadow: 0 0 12px rgba(38, 222, 192, 0.3); }
        button:disabled { cursor: not-allowed; opacity: 0.6; }
        
        button.btn-special {
            background-color: rgba(255, 215, 0, 0.1);
            color: var(--accent-gold);
            border: 1px solid var(--accent-gold);
        }
        button.btn-special:hover:not(:disabled) {
            background-color: var(--accent-gold);
            color: #000;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }

        .dashboard-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 24px; margin-bottom: 40px; }
        .card { padding: 25px; border-radius: 16px; color: #fff; backdrop-filter: blur(10px); }
        .card h3 { margin: 0 0 10px 0; font-size: 1.1rem; }
        .card p { margin: 0; font-size: 2.2rem; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .bg-green { background: linear-gradient(135deg, rgba(16, 185, 129, 0.4), rgba(16, 185, 129, 0.1)); border: 1px solid rgba(16, 185, 129, 0.8); }
        .bg-orange { background: linear-gradient(135deg, rgba(245, 158, 11, 0.4), rgba(245, 158, 11, 0.1)); border: 1px solid rgba(245, 158, 11, 0.8); }
        .bg-blue { background: linear-gradient(135deg, rgba(59, 130, 246, 0.4), rgba(59, 130, 246, 0.1)); border: 1px solid rgba(59, 130, 246, 0.8); }
        .bg-pink { background: linear-gradient(135deg, rgba(236, 72, 153, 0.4), rgba(236, 72, 153, 0.1)); border: 1px solid rgba(236, 72, 153, 0.8); }
        
        table { width: 100%; border-collapse: collapse; background: var(--bg-card); border-radius: 12px; overflow: hidden; border: 1px solid var(--border-color); margin-top: 15px; }
        th, td { padding: 18px 20px; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { background-color: rgba(255, 255, 255, 0.02); color: var(--text-muted); }
        
        .tracking-box { background: var(--bg-card); padding: 30px; border-radius: 16px; border: 1px solid var(--border-color); }
        
        .badge { padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; }
        .badge-warning { background: rgba(245, 158, 11, 0.15); color: #f59e0b; border: 1px solid #f59e0b; }
        .badge-success { background: rgba(38, 222, 192, 0.15); color: #26dec0; border: 1px solid #26dec0; }
        .badge-info { background: rgba(59, 130, 246, 0.15); color: #3b82f6; border: 1px solid #3b82f6; }
    </style>
</head>
<body>
    
    <div id="root"></div>

    <!-- =========================================
         ส่วนที่ 2: ระบบการทำงาน (React / JavaScript)
         ========================================= -->
    <script type="text/babel">
        const { useState } = React;

        const PRICING = {
            'กุ้งก้ามกราม': { '10': 500, '9': 550, '8': 600, '7': 700, '6': 800, '5': 900, '4': 1100, '3': 1300, '2': 1600 },
            'ปูดำ/ปูทะเล': { '4': 450, '3': 600, '2': 800, '1.5': 1000, '1': 1300 },
            'กุ้งมังกร': { '1': 1800, '2': 3600, '3': 5500, '4': 7500, '5': 9500, '6': 11500, '7': 13500 },
            'ปลากระพงขาว': { '1': 180, '2': 360, '3': 540, '4': 720, '5': 900, '6': 1140, '7': 1330, '8': 1520, '9': 1710, '10': 1900 },
            'หอยเชลล์': { 'เล็ก': 350, 'กลาง': 450, 'ใหญ่': 600, 'จัมโบ้': 800 },
            'หอยแครง': { 'เล็ก': 120, 'กลาง': 150, 'ใหญ่': 180, 'คัดพิเศษ': 220 },
            'ปลาหมึกกล้วย': { 'เล็ก': 150, 'กลาง': 220, 'ใหญ่': 280 },
            'ปูม้า': { 'เล็ก': 350, 'กลาง': 450, 'ใหญ่': 550 },
            'หอยนางรมสุราษฎร์': { 'กลาง': 45, 'ใหญ่': 60, 'จัมโบ้': 80 },
            'กุ้งแชบ๊วย': { 'เล็ก': 250, 'กลาง': 350, 'ใหญ่': 450 },
            'แมงดาทะเลไข่': { 'กลาง': 300, 'ใหญ่': 400 },
            'ปลาแซลมอน': { '5kg': 2500 },
            'ปูทาราบะ': { '3kg': 8900 },
            'กุ้งมังกรเจ็ดสี': { '2.5kg': 5500 },
            'ปลาหิมะ': { '4kg': 4800 },
            'หอยเป๋าฮื้อสด': { '1kg': 2200 },
            'ปูจั๊กจั่น': { '1kg': 650 },
            // อัปเดตปลาเก๋ายักษ์ 2 ขนาดตามสั่ง
            'ปลาเก๋ายักษ์': { '150kg': 109000, '320kg': 351000 }
        };

        function App() {
            const [activeTab, setActiveTab] = useState('shop');

            // --- โปรโมชั่น Double Day ---
            const today = new Date();
            const currentDay = today.getDate();
            const currentMonth = today.getMonth() + 1;
            const isDoubleDay = (currentDay === currentMonth) || true; 
            const displayDay = currentDay === currentMonth ? currentDay : 9; 
            const displayMonth = currentDay === currentMonth ? currentMonth : 9;
            const todayPromoCode = `MEGA${displayDay}${displayMonth}`; 

            const [showPromoPopup, setShowPromoPopup] = useState(true);
            const [promoCodeInput, setPromoCodeInput] = useState('');
            const [discountPercent, setDiscountPercent] = useState(0);

            // --- State ตะกร้าและ Checkout ---
            const [cart, setCart] = useState([]);
            const [customerName, setCustomerName] = useState('');
            const [customerPhone, setCustomerPhone] = useState('');
            const [customerAddress, setCustomerAddress] = useState('');
            const [paymentMethod, setPaymentMethod] = useState('cod'); 

            // --- State สินค้า ---
            const [shrimpSize, setShrimpSize] = useState('10');
            const [shrimpDelivery, setShrimpDelivery] = useState('แพ็คออกซิเจน (แบบเป็นๆ)');
            const [shrimpQty, setShrimpQty] = useState(1);

            const [crabSize, setCrabSize] = useState('4');
            const [crabDelivery, setCrabDelivery] = useState('มัดเชือกกล้วย (แบบเป็นๆ)');
            const [crabQty, setCrabQty] = useState(1);

            const [lobsterSize, setLobsterSize] = useState('1');
            const [lobsterDelivery, setLobsterDelivery] = useState('แพ็คออกซิเจน (แบบเป็นๆ)');
            const [lobsterQty, setLobsterQty] = useState(1);

            const [snapperSize, setSnapperSize] = useState('1');
            const [snapperDelivery, setSnapperDelivery] = useState('น็อคน้ำแข็ง (แบบแช่แข็ง)');
            const [snapperQty, setSnapperQty] = useState(1);

            const [scallopSize, setScallopSize] = useState('เล็ก');
            const [scallopDelivery, setScallopDelivery] = useState('แช่แข็ง (ทำความสะอาดแล้ว)');
            const [scallopQty, setScallopQty] = useState(1);

            const [cockleSize, setCockleSize] = useState('เล็ก');
            const [cockleDelivery, setCockleDelivery] = useState('แพ็คออกซิเจน (แบบเป็นๆ)');
            const [cockleQty, setCockleQty] = useState(1);

            const [squidSize, setSquidSize] = useState('ใหญ่');
            const [squidDelivery, setSquidDelivery] = useState('น็อคน้ำแข็ง (แบบแช่แข็ง)');
            const [squidQty, setSquidQty] = useState(1);

            const [blueCrabSize, setBlueCrabSize] = useState('ใหญ่');
            const [blueCrabDelivery, setBlueCrabDelivery] = useState('แพ็คออกซิเจน (แบบเป็นๆ)');
            const [blueCrabQty, setBlueCrabQty] = useState(1);

            const [oysterSize, setOysterSize] = useState('จัมโบ้');
            const [oysterDelivery, setOysterDelivery] = useState('น็อคน้ำแข็ง (แบบแช่แข็ง)');
            const [oysterQty, setOysterQty] = useState(1);

            const [bananaShrimpSize, setBananaShrimpSize] = useState('ใหญ่');
            const [bananaShrimpDelivery, setBananaShrimpDelivery] = useState('น็อคน้ำแข็ง (แบบแช่แข็ง)');
            const [bananaShrimpQty, setBananaShrimpQty] = useState(1);

            const [horseshoeCrabSize, setHorseshoeCrabSize] = useState('ใหญ่');
            const [horseshoeCrabDelivery, setHorseshoeCrabDelivery] = useState('น็อคน้ำแข็ง (แบบแช่แข็ง)');
            const [horseshoeCrabQty, setHorseshoeCrabQty] = useState(1);

            const [salmonDelivery, setSalmonDelivery] = useState('น็อคน้ำแข็ง (แบบแช่แข็ง)');
            const [salmonQty, setSalmonQty] = useState(1);

            const [kingCrabDelivery, setKingCrabDelivery] = useState('แพ็คออกซิเจน (แบบเป็นๆ)');
            const [kingCrabQty, setKingCrabQty] = useState(1);

            const [sevenLobsterDelivery, setSevenLobsterDelivery] = useState('แพ็คออกซิเจน (แบบเป็นๆ)');
            const [sevenLobsterQty, setSevenLobsterQty] = useState(1);

            const [snowFishDelivery, setSnowFishDelivery] = useState('น็อคน้ำแข็ง (แบบแช่แข็ง)');
            const [snowFishQty, setSnowFishQty] = useState(1);

            const [abaloneDelivery, setAbaloneDelivery] = useState('แพ็คออกซิเจน (แบบเป็นๆ)');
            const [abaloneQty, setAbaloneQty] = useState(1);

            const [frogCrabDelivery, setFrogCrabDelivery] = useState('น็อคน้ำแข็ง (แบบแช่แข็ง)');
            const [frogCrabQty, setFrogCrabQty] = useState(1);

            // State สำหรับปลาเก๋ายักษ์ (เลือกขนาด 150kg หรือ 320kg)
            const [giantGrouperSize, setGiantGrouperSize] = useState('150kg');
            const [giantGrouperDelivery, setGiantGrouperDelivery] = useState('รถออกซิเจนพิเศษ (แบบเป็นๆ)');
            const [giantGrouperQty, setGiantGrouperQty] = useState(1);

            // --- State ระบบหลังบ้าน (Records) ---
            const [trackId, setTrackId] = useState('');
            const [trackingStatus, setTrackingStatus] = useState(false);

            const [recordType, setRecordType] = useState('in'); 
            const [recordDate, setRecordDate] = useState(new Date().toISOString().split('T')[0]); 
            const [recordProduct, setRecordProduct] = useState('กุ้งก้ามกราม');
            const [recordQty, setRecordQty] = useState(1);
            const [recordPrice, setRecordPrice] = useState(0);

            // ข้อมูลสต็อกเริ่มต้น (ทุกอย่างเป็น 500)
            const [recordsList, setRecordsList] = useState([
                { id: 1, date: new Date().toISOString().split('T')[0], type: 'in', product: 'กุ้งก้ามกราม', qty: 500, price: '-' },
                { id: 2, date: new Date().toISOString().split('T')[0], type: 'in', product: 'ปูดำ/ปูทะเล', qty: 500, price: '-' },
                { id: 3, date: new Date().toISOString().split('T')[0], type: 'in', product: 'กุ้งมังกร', qty: 500, price: '-' },
                { id: 4, date: new Date().toISOString().split('T')[0], type: 'in', product: 'ปลากระพงขาว', qty: 500, price: '-' },
                { id: 5, date: new Date().toISOString().split('T')[0], type: 'in', product: 'หอยเชลล์', qty: 500, price: '-' },
                { id: 6, date: new Date().toISOString().split('T')[0], type: 'in', product: 'หอยแครง', qty: 500, price: '-' },
                { id: 7, date: new Date().toISOString().split('T')[0], type: 'in', product: 'ปลาหมึกกล้วย', qty: 500, price: '-' },
                { id: 8, date: new Date().toISOString().split('T')[0], type: 'in', product: 'ปูม้า', qty: 500, price: '-' },
                { id: 9, date: new Date().toISOString().split('T')[0], type: 'in', product: 'หอยนางรมสุราษฎร์', qty: 500, price: '-' },
                { id: 10, date: new Date().toISOString().split('T')[0], type: 'in', product: 'กุ้งแชบ๊วย', qty: 500, price: '-' },
                { id: 11, date: new Date().toISOString().split('T')[0], type: 'in', product: 'แมงดาทะเลไข่', qty: 500, price: '-' },
                { id: 12, date: new Date().toISOString().split('T')[0], type: 'in', product: 'ปลาแซลมอน', qty: 500, price: '-' },
                { id: 13, date: new Date().toISOString().split('T')[0], type: 'in', product: 'ปูทาราบะ', qty: 500, price: '-' },
                { id: 14, date: new Date().toISOString().split('T')[0], type: 'in', product: 'กุ้งมังกรเจ็ดสี', qty: 500, price: '-' },
                { id: 15, date: new Date().toISOString().split('T')[0], type: 'in', product: 'ปลาหิมะ', qty: 500, price: '-' },
                { id: 16, date: new Date().toISOString().split('T')[0], type: 'in', product: 'หอยเป๋าฮื้อสด', qty: 500, price: '-' },
                { id: 17, date: new Date().toISOString().split('T')[0], type: 'in', product: 'ปูจั๊กจั่น', qty: 500, price: '-' },
                { id: 18, date: new Date().toISOString().split('T')[0], type: 'in', product: 'ปลาเก๋ายักษ์', qty: 500, price: '-' }
            ]);

            const getAvailableStock = (productName) => {
                const totalIn = recordsList.filter(r => r.product === productName && r.type === 'in').reduce((sum, r) => sum + r.qty, 0);
                const totalOut = recordsList.filter(r => r.product === productName && r.type === 'out').reduce((sum, r) => sum + r.qty, 0);
                const totalInCart = cart.filter(c => c.product === productName).reduce((sum, c) => sum + c.qty, 0);
                return totalIn - totalOut - totalInCart;
            };

            const stockShrimp = getAvailableStock('กุ้งก้ามกราม');
            const stockCrab = getAvailableStock('ปูดำ/ปูทะเล');
            const stockLobster = getAvailableStock('กุ้งมังกร');
            const stockSnapper = getAvailableStock('ปลากระพงขาว');
            const stockScallop = getAvailableStock('หอยเชลล์');
            const stockCockle = getAvailableStock('หอยแครง');
            const stockSquid = getAvailableStock('ปลาหมึกกล้วย');
            const stockBlueCrab = getAvailableStock('ปูม้า');
            const stockOyster = getAvailableStock('หอยนางรมสุราษฎร์');
            const stockBananaShrimp = getAvailableStock('กุ้งแชบ๊วย');
            const stockHorseshoeCrab = getAvailableStock('แมงดาทะเลไข่');
            const stockSalmon = getAvailableStock('ปลาแซลมอน');
            const stockKingCrab = getAvailableStock('ปูทาราบะ');
            const stockSevenLobster = getAvailableStock('กุ้งมังกรเจ็ดสี');
            const stockSnowFish = getAvailableStock('ปลาหิมะ');
            const stockAbalone = getAvailableStock('หอยเป๋าฮื้อสด');
            const stockFrogCrab = getAvailableStock('ปูจั๊กจั่น');
            const stockGiantGrouper = getAvailableStock('ปลาเก๋ายักษ์');

            const handleAddToCart = (product, sizeKey, delivery, qty, unit, currentStock) => {
                const orderQty = Number(qty);
                if (orderQty <= 0) return alert('กรุณาระบุจำนวนที่ถูกต้อง');
                if (orderQty > currentStock) return alert(`❌ สินค้าในสต็อกไม่เพียงพอ!\n(สินค้าคงเหลือ: ${currentStock} ${unit})`);
                
                const pricePerUnit = PRICING[product][sizeKey];
                const total = pricePerUnit * orderQty;
                
                const newItem = { id: Date.now() + Math.random(), product, sizeKey, delivery, qty: orderQty, unit, pricePerUnit, total };
                setCart([...cart, newItem]);
                alert(`เพิ่ม ${product} ลงตะกร้าเรียบร้อยแล้ว!`);
            };

            const handleRemoveFromCart = (idToRemove) => setCart(cart.filter(item => item.id !== idToRemove));

            const cartTotalAmount = cart.reduce((sum, item) => sum + item.total, 0);
            const discountAmount = cartTotalAmount * (discountPercent / 100);
            const finalTotalAmount = cartTotalAmount - discountAmount;

            const applyPromoCode = () => {
                if (promoCodeInput.toUpperCase() === todayPromoCode) {
                    setDiscountPercent(10);
                    alert('✅ ใช้โค้ดสำเร็จ! ได้รับส่วนลด 10%');
                } else {
                    setDiscountPercent(0);
                    alert('❌ โค้ดส่วนลดไม่ถูกต้อง หรือหมดอายุแล้ว');
                }
            };

            const goToCheckout = () => {
                if (cart.length === 0) return alert('ตะกร้าสินค้าว่างเปล่า!');
                setActiveTab('checkout');
            };

            const handleConfirmOrder = () => {
                if (!customerName || !customerPhone || !customerAddress) return alert('กรุณากรอกข้อมูลจัดส่งให้ครบถ้วน');

                const autoRecords = cart.map(item => ({
                    id: Date.now() + Math.random(), date: new Date().toISOString().split('T')[0], type: 'out',
                    product: item.product, qty: item.qty, price: item.total
                }));

                setRecordsList([...autoRecords, ...recordsList]);
                alert(`✅ ยืนยันคำสั่งซื้อสำเร็จ!\nขอบคุณคุณ ${customerName}\nยอดชำระทั้งหมด: ฿${finalTotalAmount.toLocaleString()}\n(ระบบทำการตัดสต็อกสินค้าเรียบร้อยแล้ว)`);
                
                setCart([]); setCustomerName(''); setCustomerPhone(''); setCustomerAddress(''); setPromoCodeInput(''); setDiscountPercent(0); setActiveTab('orders'); 
            };

                                        <option value="ปูจั๊กจั่น">ปูจั๊กจั่น</option>
                                        <option value="ปลาเก๋ายักษ์">ปลาเก๋ายักษ์</option>
                                    </select>
                                    <input type="number" placeholder="จำนวน (ตัว/กก.)" value={recordQty} onChange={e => setRecordQty(e.target.value)} style={{marginBottom:'15px'}}/>
                                    {recordType === 'out' && <input type="number" placeholder="ราคาขายรวม (บาท)" value={recordPrice} onChange={e => setRecordPrice(e.target.value)} style={{marginBottom:'15px'}}/>}
                                    <button onClick={handleSaveRecord}>บันทึกข้อมูล</button>
                                </div>

                                <h3 style={{marginTop: '40px'}}>ประวัติการทำรายการล่าสุด</h3>
                                <table>
                                    <thead>
                                        <tr>
                                            <th>วันที่</th>
                                            <th>ประเภท</th>
                                            <th>สินค้า</th>
                                            <th>จำนวน</th>
                                            <th>ยอดเงิน (บาท)</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {recordsList.length === 0 ? (
                                            <tr><td colSpan="5" style={{ textAlign: 'center' }}>ยังไม่มีข้อมูลการบันทึก</td></tr>
                                        ) : (
                                            recordsList.slice(0).reverse().map((record) => (
                                                <tr key={record.id}>
                                                    <td>{record.date}</td>
                                                    <td>
                                                        {record.type === 'in' 
                                                            ? <span className="badge badge-success">📥 นำเข้า</span> 
                                                            : <span className="badge badge-warning">📤 ขายออก</span>
                                                        }
                                                    </td>
                                                    <td>{record.product}</td>
                                                    <td>{record.qty}</td>
                                                    <td style={{ color: record.type === 'out' ? '#26dec0' : '#e2e8f0' }}>
                                                        {record.price !== '-' ? `฿${Number(record.price).toLocaleString()}` : '-'}
                                                    </td>
                                                </tr>
                                            ))
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        )}
                        
                        {/* ======================= 5. เช็คจำนวนคำสั่งซื้อ (Orders) ======================= */}
                        {activeTab === 'orders' && (
                            <div className="section">
                                <h1 className="header-title">📦 แดชบอร์ด: สรุปคำสั่งซื้อวันนี้</h1>
                                <div className="dashboard-cards">
                                    <div className="card bg-green"><h3>คำสั่งซื้อทั้งหมด</h3><p>1,250 กก.</p></div>
                                    <div className="card bg-orange"><h3>รอแพ็ค (แบบเป็นๆ)</h3><p>430 กก.</p></div>
                                    <div className="card bg-blue"><h3>รอแพ็ค (แช่แข็ง)</h3><p>820 กก.</p></div>
                                    <div className="card bg-pink"><h3>รอดำเนินการจัดส่ง</h3><p>15 ออเดอร์</p></div>
                                </div>
                                
                                <h3>รายการออเดอร์ล่าสุด</h3>
                                <table>
                                    <thead>
                                        <tr>
                                            <th>รหัสคำสั่งซื้อ</th>
                                            <th>ลูกค้า</th>
                                            <th>ยอดรวม</th>
                                            <th>สถานะ</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr>
                                            <td>ORD-001</td>
                                            <td>คุณ สมชาย</td>
                                            <td>฿2,500</td>
                                            <td><span className="badge badge-warning">รอจัดเตรียม</span></td>
                                        </tr>
                                        <tr>
                                            <td>ORD-002</td>
                                            <td>คุณ สมหญิง</td>
                                            <td>฿14,500</td>
                                            <td><span className="badge badge-success">พร้อมส่ง</span></td>
                                        </tr>
                                        <tr>
                                            <td>ORD-003</td>
                                            <td>บจก. ซีฟู้ดไทย</td>
                                            <td>฿351,000</td>
                                            <td><span className="badge badge-info">กำลังจัดส่ง</span></td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        )}

                        {/* ======================= 6. เช็คสถานะขนส่ง (Tracking) ======================= */}
                        {activeTab === 'tracking' && (
                            <div className="section">
                                <h1 className="header-title">🚚 ระบบติดตามการขนส่ง (Tracking)</h1>
                                <div className="tracking-box">
                                    <div className="form-group">
                                        <label>กรอกรหัสคำสั่งซื้อ หรือ เลขพัสดุ:</label>
                                        <input type="text" placeholder="เช่น ORD-001" value={trackId} onChange={(e) => setTrackId(e.target.value)}/>
                                    </div>
                                    <button onClick={handleTrackOrder}>ตรวจสอบสถานะ</button>
                                    
                                    {trackingStatus && (
                                        <div style={{ marginTop: '30px', padding: '20px', background: 'rgba(38, 222, 192, 0.05)', borderRadius: '12px', border: '1px solid #26dec0' }}>
                                            <h3 style={{ color: '#26dec0', marginTop: 0, borderBottom: '1px dashed #263040', paddingBottom: '10px' }}>สถานะพัสดุ: {trackId}</h3>
                                            
                                            <ul style={{ listStyle: 'none', padding: 0, margin: 0, position: 'relative' }}>
                                                <li style={{ paddingLeft: '25px', borderLeft: '2px solid #26dec0', paddingBottom: '20px', position: 'relative' }}>
                                                    <span style={{ position: 'absolute', left: '-7px', top: '0', width: '12px', height: '12px', background: '#26dec0', borderRadius: '50%', boxShadow: '0 0 10px #26dec0' }}></span>
                                                    <div style={{ color: '#fff', fontWeight: 'bold' }}>จัดส่งออกจากฟาร์มแล้ว</div>
                                                    <div style={{ fontSize: '0.85rem', color: '#8b949e', marginTop: '5px' }}>วันนี้ 08:30 น. - รถควบคุมอุณหภูมิ 4°C (ขนส่งร่วมห้องเย็น)</div>
                                                </li>
                                                <li style={{ paddingLeft: '25px', borderLeft: '2px solid #263040', paddingBottom: '20px', position: 'relative' }}>
                                                    <span style={{ position: 'absolute', left: '-7px', top: '0', width: '12px', height: '12px', background: '#263040', borderRadius: '50%' }}></span>
                                                    <div style={{ color: '#8b949e' }}>กำลังนำส่งถึงปลายทาง</div>
                                                </li>
                                                <li style={{ paddingLeft: '25px', position: 'relative' }}>
                                                    <span style={{ position: 'absolute', left: '-7px', top: '0', width: '12px', height: '12px', background: '#263040', borderRadius: '50%' }}></span>
                                                    <div style={{ color: '#8b949e' }}>พัสดุจัดส่งสำเร็จ</div>
                                                </li>
                                            </ul>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
