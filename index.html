<!DOCTYPE html>
<html lang="th">
<head>

            --bg-card: #131823;         
            --accent-cyan: #26dec0;     
            --accent-gold: #ffd700;
            --accent-coral: #ff6b6b;
            --text-main: #e2e8f0;       
            --text-muted: #8b949e;      
            --border-color: #263040;    
        }
        
        body { margin: 0; padding: 0; }
        .app-container { display: flex; min-height: 100vh; font-family: 'Segoe UI', Prompt, sans-serif; background-color: var(--bg-main); color: var(--text-main); }
        
        .sidebar { width: 260px; background-color: var(--bg-card); border-right: 1px solid var(--border-color); padding-top: 30px; display: flex; flex-direction: column; z-index: 10; }
        .sidebar h2 { text-align: center; margin-bottom: 30px; font-size: 1.3rem; color: var(--accent-cyan); }
        .menu-item { padding: 14px 20px; cursor: pointer; transition: 0.3s; font-size: 1rem; border-left: 4px solid transparent; color: var(--text-muted); }
        .menu-item:hover, .menu-item.active { background-color: rgba(38, 222, 192, 0.05); border-left: 4px solid var(--accent-cyan); color: var(--accent-cyan); }
        
        .main-content { flex: 1; padding: 40px; overflow-y: auto; }
        .section { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .header-title { font-size: 1.8rem; margin-bottom: 30px; border-bottom: 2px solid var(--border-color); padding-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        
        .shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; }
        .product-card { background: var(--bg-card); padding: 25px; border-radius: 16px; border: 1px solid var(--border-color); transition: 0.3s; display: flex; flex-direction: column; justify-content: space-between; }

        .product-card h3 { margin-top: 0; color: var(--text-main); font-size: 1.2rem; margin-bottom: 5px; }
        .product-card p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 15px; line-height: 1.4; }
        
        .product-card.special-item {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.08) 0%, rgba(19, 24, 35, 1) 100%);
            border: 2px solid var(--accent-gold);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);

        select, input[type="text"], input[type="number"], input[type="date"], input[type="password"], textarea { width: 100%; padding: 12px 15px; border: 1px solid var(--border-color); border-radius: 8px; box-sizing: border-box; font-size: 1rem; color: var(--text-main); background-color: var(--bg-main); color-scheme: dark; }
        select:focus, input:focus, textarea:focus { outline: none; border-color: var(--accent-cyan); }
        
        button { background-color: rgba(38, 222, 192, 0.05); color: var(--accent-cyan); border: 1px solid var(--accent-cyan); padding: 12px 20px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; font-size: 1rem; transition: 0.2s; margin-top: auto; }
        button:hover:not(:disabled) { background-color: var(--accent-cyan); color: #000; box-shadow: 0 0 12px rgba(38, 222, 192, 0.3); }
        button:disabled { cursor: not-allowed; opacity: 0.6; }

        .login-box { background: var(--bg-card); padding: 40px; border-radius: 20px; border: 1px solid var(--accent-cyan); max-width: 400px; margin: 50px auto; box-shadow: 0 15px 35px rgba(0,0,0,0.4); text-align: center; }

        /* ผังโต๊ะริมทะเล */
        .table-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; margin-top: 20px; }
        .table-item { background: var(--bg-card); border: 2px solid var(--border-color); border-radius: 12px; padding: 15px; text-align: center; cursor: pointer; transition: 0.2s; }
        .table-item.available { border-color: #10b981; }
        .table-item.available:hover { background: rgba(16, 185, 129, 0.1); }
        .table-item.booked { border-color: #ef4444; background: rgba(239, 68, 68, 0.05); cursor: not-allowed; opacity: 0.7; }
        .table-item.selected { border-color: var(--accent-cyan); background: rgba(38, 222, 192, 0.15); box-shadow: 0 0 15px rgba(38, 222, 192, 0.3); }

        .dashboard-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 24px; margin-bottom: 40px; }
        .card { padding: 25px; border-radius: 16px; color: #fff; backdrop-filter: blur(10px); }
        .card h3 { margin: 0 0 10px 0; font-size: 1.1rem; }
        .card p { margin: 0; font-size: 2.2rem; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .bg-green { background: linear-gradient(135deg, rgba(16, 185, 129, 0.4), rgba(16, 185, 129, 0.1)); border: 1px solid rgba(16, 185, 129, 0.8); }
        .bg-orange { background: linear-gradient(135deg, rgba(245, 158, 11, 0.4), rgba(245, 158, 11, 0.1)); border: 1px solid rgba(245, 158, 11, 0.8); }
        .bg-blue { background: linear-gradient(135deg, rgba(59, 130, 246, 0.4), rgba(59, 130, 246, 0.1)); border: 1px solid rgba(59, 130, 246, 0.8); }
        .bg-pink { background: linear-gradient(135deg, rgba(236, 72, 153, 0.4), rgba(236, 72, 153, 0.1)); border: 1px solid rgba(236, 72, 153, 0.8); }
        
        table { width: 100%; border-collapse: collapse; background: var(--bg-card); border-radius: 12px; overflow: hidden; border: 1px solid var(--border-color); margin-top: 15px; }
        th, td { padding: 16px 20px; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { background-color: rgba(255, 255, 255, 0.02); color: var(--text-muted); }
        
        .tracking-box { background: var(--bg-card); padding: 30px; border-radius: 16px; border: 1px solid var(--border-color); }
        .badge { padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; }
        .badge-warning { background: rgba(245, 158, 11, 0.15); color: #f59e0b; border: 1px solid #f59e0b; }
        .badge-success { background: rgba(38, 222, 192, 0.15); color: #26dec0; border: 1px solid #26dec0; }
        .badge-info { background: rgba(59, 130, 246, 0.15); color: #3b82f6; border: 1px solid #3b82f6; }

        .chart-container { display: flex; align-items: flex-end; gap: 15px; height: 200px; padding: 20px; background: rgba(0,0,0,0.2); border-radius: 8px; border: 1px solid var(--border-color); margin-top: 20px; }
        .chart-bar-wrapper { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; }
        .chart-bar { width: 100%; background: var(--accent-cyan); border-radius: 4px 4px 0 0; transition: 0.5s; }
        .chart-label { font-size: 0.8rem; color: var(--text-muted); margin-top: 8px; text-align: center; }

        .buffet-box { background: rgba(0,0,0,0.3); padding: 20px; border-radius: 12px; }
        .buffet-box ul { padding-left: 20px; line-height: 1.8; color: var(--text-main); margin: 10px 0 0 0; }
    </style>
</head>

            const [scallopQty, setScallopQty] = useState(1);

            const [cockleSize, setCockleSize] = useState('เล็ก');

            const [blueCrabDelivery, setBlueCrabDelivery] = useState('แพ็คออกซิเจน (แบบเป็นๆ)');
            const [blueCrabQty, setBlueCrabQty] = useState(1);

            const [oysterSize, setOysterSize] = useState('จัมโบ้');
            const [oysterDelivery, setOysterDelivery] = useState('น็อคน้ำแข็ง (แบบแช่แข็ง)');
            const [oysterQty, setOysterQty] = useState(1);

            const [bananaShrimpSize, setBananaShrimpSize] = useState('ใหญ่');

            const [bananaShrimpQty, setBananaShrimpQty] = useState(1);

            const [horseshoeCrabSize, setHorseshoeCrabSize] = useState('ใหญ่');

            const [horseshoeCrabQty, setHorseshoeCrabQty] = useState(1);

            const [salmonQty, setSalmonQty] = useState(1);

            const [kingCrabDelivery, setKingCrabDelivery] = useState('แพ็คออกซิเจน (แบบเป็นๆ)');
            const [kingCrabQty, setKingCrabQty] = useState(1);

            const [sevenLobsterDelivery, setSevenLobsterDelivery] = useState('แพ็คออกซิเจน (แบบเป็นๆ)');
            const [sevenLobsterQty, setSevenLobsterQty] = useState(1);

            const [snowFishDelivery, setSnowFishDelivery] = useState('น็อคน้ำแข็ง (แบบแช่แข็ง)');
            const [snowFishQty, setSnowFishQty] = useState(1);

            const [abaloneDelivery, setAbaloneDelivery] = useState('แพ็คออกซิเจน (แบบเป็นๆ)');
            const [abaloneQty, setAbaloneQty] = useState(1);

            const [frogCrabDelivery, setFrogCrabDelivery] = useState('น็อคน้ำแข็ง (แบบแช่แข็ง)');
            const [frogCrabQty, setFrogCrabQty] = useState(1);

            const [giantGrouperSize, setGiantGrouperSize] = useState('150kg');
            const [giantGrouperDelivery, setGiantGrouperDelivery] = useState('รถออกซิเจนพิเศษ (แบบเป็นๆ)');
            const [giantGrouperQty, setGiantGrouperQty] = useState(1);

            const [trackId, setTrackId] = useState('');
            const [trackingStatus, setTrackingStatus] = useState(false);

            // --- State เมนูอาหาร A La Carte ---
            const [restSelections, setRestSelections] = useState({});
            const [buffetQty, setBuffetQty] = useState(1);

            // คำนวณสต็อก
            const getAvailableStock = (productName) => {
                const totalIn = recordsList.filter(r => r.product === productName && r.type === 'in').reduce((sum, r) => sum + r.qty, 0);
                const totalOut = recordsList.filter(r => r.product === productName && r.type === 'out').reduce((sum, r) => sum + r.qty, 0);
                const totalInCart = cart.filter(c => c.product.includes(productName)).reduce((sum, c) => sum + c.qty, 0);
                return totalIn - totalOut - totalInCart;
            };

            const stockShrimp = getAvailableStock('กุ้งก้ามกราม');
            const stockCrab = getAvailableStock('ปูดำ/ปูทะเล');
            const stockLobster = getAvailableStock('กุ้งมังกร');
            const stockSnapper = getAvailableStock('ปลากระพงขาว');
            const stockScallop = getAvailableStock('หอยเชลล์');
            const stockCockle = getAvailableStock('หอยแครง');
            const stockSquid = getAvailableStock('ปลาหมึกกล้วย');
            const stockBlueCrab = getAvailableStock('ปูม้า');
            const stockOyster = getAvailableStock('หอยนางรมสุราษฎร์');
            const stockBananaShrimp = getAvailableStock('กุ้งแชบ๊วย');
            const stockHorseshoeCrab = getAvailableStock('แมงดาทะเลไข่');
            const stockSalmon = getAvailableStock('ปลาแซลมอน');
            const stockKingCrab = getAvailableStock('ปูทาราบะ');
            const stockSevenLobster = getAvailableStock('กุ้งมังกรเจ็ดสี');
            const stockSnowFish = getAvailableStock('ปลาหิมะ');
            const stockAbalone = getAvailableStock('หอยเป๋าฮื้อสด');
            const stockFrogCrab = getAvailableStock('ปูจั๊กจั่น');
            const stockGiantGrouper = getAvailableStock('ปลาเก๋ายักษ์');

            // วิเคราะห์สถิติ
            const productSalesSummary = {};
            recordsList.filter(r => r.type === 'out').forEach(r => {
                productSalesSummary[r.product] = (productSalesSummary[r.product] || 0) + r.qty;
            });
            const sortedProducts = Object.entries(productSalesSummary).sort((a, b) => b[1] - a[1]);
            const mostSoldProduct = sortedProducts.length > 0 ? sortedProducts[0] : ['ยังไม่มีข้อมูล', 0];
            const leastSoldProduct = sortedProducts.length > 0 ? sortedProducts[sortedProducts.length - 1] : ['ยังไม่มีข้อมูล', 0];

            // Functions เพิ่มลงตะกร้า
            const handleAddToCart = (product, sizeKey, delivery, qty, unit, currentStock) => {
                const orderQty = Number(qty);
                if (orderQty <= 0) return alert('กรุณาระบุจำนวนที่ถูกต้อง');
                if (orderQty > currentStock) return alert(`❌ สินค้าในสต็อกไม่เพียงพอ!\n(สินค้าคงเหลือ: ${currentStock} ${unit})`);
                
                const pricePerUnit = PRICING[product][sizeKey];
                const total = pricePerUnit * orderQty;
                
                setCart([...cart, { id: Date.now() + Math.random(), product, sizeKey, delivery, qty: orderQty, unit, pricePerUnit, total }]);
                alert(`เพิ่ม ${product} ลงตะกร้าเรียบร้อยแล้ว!`);
            };

            const updateRestSelection = (product, field, value) => {
                setRestSelections(prev => ({ ...prev, [product]: { ...prev[product], [field]: value } }));
            };

            const handleAddRestToCart = (name, item) => {
                const selectedSize = restSelections[name]?.size || Object.keys(item.sizes)[0];
                const selectedOption = restSelections[name]?.option || (item.options ? Object.keys(item.options)[0] : '');
                const qty = Number(restSelections[name]?.qty || 1);

                if (qty <= 0) return alert('กรุณาระบุจำนวน');

                const basePrice = item.sizes[selectedSize];
                const extraPrice = item.options && selectedOption ? item.options[selectedOption] : 0;
                const currentPrice = basePrice + extraPrice;
                const total = currentPrice * qty;

                let displayName = `${name} (${selectedSize})`;
                if (selectedOption) displayName += ` - ${selectedOption}`;

                setCart([...cart, { id: Date.now() + Math.random(), product: displayName, qty: qty, unit: 'จาน', pricePerUnit: currentPrice, total: total }]);
                alert(`เพิ่ม "${displayName}" ลงตะกร้าแล้ว!`);
            };

            const handleAddBuffet = () => {
                const qty = Number(buffetQty);
                if(qty <= 0) return;
                setCart([...cart, { id: Date.now(), product: 'แพ็กเกจบุฟเฟต์ทะเลเผา', qty: qty, unit: 'ท่าน', pricePerUnit: 699, total: 699 * qty }]);
                alert('จองบุฟเฟต์ทะเลเผาลงตะกร้าแล้ว!');
            };

            const handleRemoveFromCart = (idToRemove) => setCart(cart.filter(item => item.id !== idToRemove));

            const cartTotalAmount = cart.reduce((sum, item) => sum + item.total, 0);
            const discountAmount = cartTotalAmount * (discountPercent / 100);
            const finalTotalAmount = cartTotalAmount - discountAmount;

            const applyPromoCode = () => {
                if (promoCodeInput.toUpperCase() === todayPromoCode) {
                    setDiscountPercent(10);
                    alert('✅ ใช้โค้ดสำเร็จ! ได้รับส่วนลด 10%');
                } else {
                    setDiscountPercent(0);
                    alert('❌ โค้ดส่วนลดไม่ถูกต้อง');
                }
            };

            const handleConfirmOrder = () => {
                if (cart.length === 0) return alert('ตะกร้าว่างเปล่า!');
                if (!customerName || !customerPhone) return alert('กรุณากรอกชื่อและเบอร์โทรติดต่อ');

                const autoRecords = cart.map(item => ({
                    id: Date.now() + Math.random(), date: new Date().toISOString().split('T')[0], type: 'out',
                    product: item.product, qty: item.qty, price: item.total
                }));

                setRecordsList([...autoRecords, ...recordsList]);
                alert(`✅ ยืนยันคำสั่งซื้อสำเร็จ!\nขอบคุณคุณ ${customerName}\nยอดชำระสุทธิ: ฿${finalTotalAmount.toLocaleString()}`);
                setCart([]); setCustomerName(''); setCustomerPhone(''); setPromoCodeInput(''); setDiscountPercent(0); setActiveTab('orders'); 
            };

            const handleBookTable = () => {
                if (!selectedTable) return alert('กรุณาเลือกโต๊ะที่ต้องการจอง');
                if (!reservationName || !reservationDate) return alert('กรุณากรอกชื่อและวันที่จองโต๊ะ');

                setTables(tables.map(t => t.id === selectedTable.id ? { ...t, status: 'booked', reservedBy: reservationName } : t));
                alert(`✅ จอง ${selectedTable.name} สำเร็จ!\nราคาค่าจองโต๊ะ: 1,500 บาท\nชื่อผู้จอง: ${reservationName}\nวันที่: ${reservationDate}`);
                setSelectedTable(null); setReservationName('');
            };

            const handleTrackOrder = () => {
                if(trackId.trim() === '') return alert('กรุณากรอกรหัสพัสดุ');
                setTrackingStatus(true);
            };

            const handleAddReview = (e) => {
                e.preventDefault();
                if(!newReviewName || !newReviewComment) return alert('กรุณากรอกชื่อและข้อความรีวิว');
                const reviewItem = {
                    id: Date.now(), name: newReviewName, rating: Number(newReviewRating), comment: newReviewComment, date: new Date().toISOString().split('T')[0]
                };
                setReviews([reviewItem, ...reviews]);
                setNewReviewName(''); setNewReviewComment('');
                alert('⭐ ขอบคุณสำหรับรีวิวของคุณครับ!');
            };

            const handleSaveRecord = () => {
                if (recordQty <= 0) return alert('กรุณากรอกจำนวนให้ถูกต้อง');
                const newRecord = { id: Date.now(), date: recordDate, type: recordType, product: recordProduct, qty: parseFloat(recordQty), price: recordType === 'out' ? parseFloat(recordPrice) : '-' };
                setRecordsList([newRecord, ...recordsList]);
                alert('บันทึกข้อมูลเรียบร้อยแล้ว!');
            };

            const handleResetAnalytics = () => {
                if (confirm('คุณต้องการรีเซ็ตข้อมูลสถิติเพื่อเริ่มรอบเก็บข้อมูล 2 เดือนใหม่ใช่หรือไม่?')) {
                    setRecordsList([]);
                    setDailyUsers(dailyUsers.map(d => ({ ...d, users: 0 })));
                    alert('✅ รีเซ็ตข้อมูลเรียบร้อยแล้ว!');
                }
            };

            const totalImported = recordsList.filter(r => r.type === 'in').reduce((sum, r) => sum + r.qty, 0);
            const totalSoldQty = recordsList.filter(r => r.type === 'out').reduce((sum, r) => sum + r.qty, 0);
            const totalRevenue = recordsList.filter(r => r.type === 'out').reduce((sum, r) => sum + (r.price || 0), 0);
            const disabledBtnStyle = { backgroundColor: 'rgba(255,255,255,0.05)', color: '#666', border: '1px solid #444', cursor: 'not-allowed' };

            return (
                <div className="app-container">
                    
                    {/* ป๊อปอัปโปรโมชั่น */}
                    {isDoubleDay && showPromoPopup && (
                        <div style={{ position: 'fixed', left: '30px', bottom: '30px', background: 'linear-gradient(135deg, #f53844 0%, #42378f 100%)', padding: '25px', borderRadius: '20px', boxShadow: '0 10px 30px rgba(245, 56, 68, 0.4)', color: 'white', zIndex: 9999, width: '260px' }}>
                            <button onClick={() => setShowPromoPopup(false)} style={{ position: 'absolute', top: '10px', right: '15px', background: 'transparent', border: 'none', color: 'white', fontSize: '1.2rem', padding: 0, width: 'auto' }}>&times;</button>
                            <h3 style={{ margin: '0 0 10px 0' }}>🎉 โปร {displayDay}.{displayMonth}</h3>
                            <p style={{ margin: '0 0 15px 0', fontSize: '0.95rem' }}>รับโค้ดส่วนลด <b>10%</b></p>
                            <div style={{ background: 'rgba(0,0,0,0.3)', padding: '12px', textAlign: 'center', borderRadius: '8px', fontWeight: 'bold', fontSize: '1.4rem', letterSpacing: '3px', border: '1px dashed rgba(255,255,255,0.5)' }}>{todayPromoCode}</div>
                            <button onClick={() => { navigator.clipboard.writeText(todayPromoCode); alert('คัดลอกโค้ดแล้ว!'); }} style={{ background: 'white', color: '#f53844', border: 'none' }}>📋 คัดลอกโค้ด</button>
                        </div>
                    )}

                    {/* เมนูด้านซ้าย */}
                    <div className="sidebar">
                        <h2>🌊 Sea Breeze</h2>
                        <div className={`menu-item ${activeTab === 'shop' ? 'active' : ''}`} onClick={() => setActiveTab('shop')}>🦐 สินค้าดิบพรีเมียม (18 รายการ)</div>
                        <div className={`menu-item ${activeTab === 'menus' ? 'active' : ''}`} onClick={() => setActiveTab('menus')}>🍲 เมนูอาหารร้าน & บุฟเฟต์</div>
                        <div className={`menu-item ${activeTab === 'booking' ? 'active' : ''}`} onClick={() => setActiveTab('booking')}>🪑 จองโต๊ะริมทะเล (20 โต๊ะ)</div>
                        <div className={`menu-item ${activeTab === 'cart' || activeTab === 'checkout' ? 'active' : ''}`} onClick={() => setActiveTab('cart')} style={{ color: cart.length > 0 ? '#26dec0' : '' }}>🛍️ ตะกร้าสินค้า ({cart.length})</div>
                        <div className={`menu-item ${activeTab === 'records' ? 'active' : ''}`} onClick={() => setActiveTab('records')}>📝 บันทึกสต็อกซื้อ-ขาย</div>
                        <div className={`menu-item ${activeTab === 'analytics' ? 'active' : ''}`} onClick={() => setActiveTab('analytics')}>📊 วิเคราะห์ & ผู้ใช้งาน</div>
                        <div className={`menu-item ${activeTab === 'reviews' ? 'active' : ''}`} onClick={() => setActiveTab('reviews')}>⭐ คำติชม & เรตติ้ง (1-5★)</div>
                        <div className={`menu-item ${activeTab === 'orders' ? 'active' : ''}`} onClick={() => setActiveTab('orders')}>📦 เช็คจำนวนคำสั่งซื้อ</div>
                        <div className={`menu-item ${activeTab === 'tracking' ? 'active' : ''}`} onClick={() => setActiveTab('tracking')}>🚚 เช็คสถานะการขนส่ง</div>
                        
                        {isLoggedIn ? (
                            <>
                                {userRole === 'admin' && <div className={`menu-item ${activeTab === 'admin' ? 'active' : ''}`} onClick={() => setActiveTab('admin')} style={{ color: '#ffd700' }}>👑 ระบบแอดมิน</div>}
                                <div className="menu-item" onClick={handleLogout} style={{ color: '#ff6b6b', marginTop: 'auto' }}>🚪 ออกจากระบบ</div>
                            </>
                        ) : (
                            <div className="menu-item" onClick={() => setActiveTab('booking')} style={{ color: '#26dec0', marginTop: 'auto' }}>🔐 เข้าสู่ระบบ (Login)</div>
                        )}
                    </div>

                    {/* เนื้อหาหลัก */}
                    <div className="main-content">
                        
                        {/* ================= 1. หน้าร้านสินค้าดิบพรีเมียม (18 รายการครบ) ================= */}
                        {activeTab === 'shop' && (
                            <div className="section">
                                <h1 className="header-title">หน้าร้าน: สั่งซื้ออาหารทะเลพรีเมียม (แบบดิบ) 18 รายการ</h1>
                                <div className="shop-grid">
                                    <div className="product-card">
                                        <div style={{ display: 'flex', justifyContent: 'space-between' }}><h3>กุ้งก้ามกราม</h3> <span style={{ color: stockShrimp > 0 ? '#26dec0' : '#ec4899', fontWeight: 'bold' }}>เหลือ: {stockShrimp} กก.</span></div>
                                        <div className="form-group"><label>ขนาด (ไซส์):</label><select value={shrimpSize} onChange={(e) => setShrimpSize(e.target.value)}><option value="10">10 ตัว/กก. (฿500)</option><option value="9">9 ตัว/กก. (฿550)</option><option value="8">8 ตัว/กก. (฿600)</option><option value="7">7 ตัว/กก. (฿700)</option><option value="6">6 ตัว/กก. (฿800)</option><option value="5">5 ตัว/กก. (฿900)</option><option value="4">4 ตัว/กก. (฿1,100)</option><option value="3">3 ตัว/กก. (฿1,300)</option><option value="2">2 ตัว/กก. (฿1,600)</option></select></div>
                                        <div className="form-group"><label>จัดส่ง:</label><select value={shrimpDelivery} onChange={(e) => setShrimpDelivery(e.target.value)}><option value="แพ็คออกซิเจน (แบบเป็นๆ)">แพ็คออกซิเจน (แบบเป็นๆ)</option><option value="น็อคน้ำแข็ง (แบบแช่แข็ง)">น็อคน้ำแข็ง (แบบแช่แข็ง)</option></select></div>
                                        <div className="form-group"><label>จำนวน (กก.):</label><input type="number" min="1" max={stockShrimp} value={shrimpQty} onChange={(e) => setShrimpQty(e.target.value)} /></div>
                                        <button onClick={() => handleAddToCart('กุ้งก้ามกราม', shrimpSize, shrimpDelivery, shrimpQty, 'กก.', stockShrimp)} disabled={stockShrimp <= 0} style={stockShrimp <= 0 ? disabledBtnStyle : {}}>{stockShrimp <= 0 ? '❌ สินค้าหมด' : `ใส่ตะกร้า (฿${PRICING['กุ้งก้ามกราม'][shrimpSize].toLocaleString()})`}</button>
                                    </div>

                                    <div className="product-card">
                                        <div style={{ display: 'flex', justifyContent: 'space-between' }}><h3>ปูดำ / ปูทะเล</h3> <span style={{ color: stockCrab > 0 ? '#26dec0' : '#ec4899', fontWeight: 'bold' }}>เหลือ: {stockCrab} กก.</span></div>
                                        <div className="form-group"><label>ขนาด (ไซส์):</label><select value={crabSize} onChange={(e) => setCrabSize(e.target.value)}><option value="4">4 ตัว/กก. (฿450)</option><option value="3">3 ตัว/กก. (฿600)</option><option value="2">2 ตัว/กก. (฿800)</option><option value="1.5">1.5 ตัว/กก. (฿1,000)</option><option value="1">1 ตัว/กก. (฿1,300)</option></select></div>
                                        <div className="form-group"><label>จัดส่ง:</label><select value={crabDelivery} onChange={(e) => setCrabDelivery(e.target.value)}><option value="มัดเชือกกล้วย (แบบเป็นๆ)">มัดเชือกกล้วย (แบบเป็นๆ)</option><option value="น็อคน้ำแข็ง (แบบแช่แข็ง)">น็อคน้ำแข็ง (แบบแช่แข็ง)</option></select></div>
                                        <div className="form-group"><label>จำนวน (กก.):</label><input type="number" min="1" max={stockCrab} value={crabQty} onChange={(e) => setCrabQty(e.target.value)} /></div>
                                        <button onClick={() => handleAddToCart('ปูดำ/ปูทะเล', crabSize, crabDelivery, crabQty, 'กก.', stockCrab)} disabled={stockCrab <= 0} style={stockCrab <= 0 ? disabledBtnStyle : {}}>{stockCrab <= 0 ? '❌ สินค้าหมด' : `ใส่ตะกร้า (฿${PRICING['ปูดำ/ปูทะเล'][crabSize].toLocaleString()})`}</button>
                                    </div>

                                        <div className="form-group"><label>จำนวน (กก.):</label><input type="number" min="1" max={stockAbalone} value={abaloneQty} onChange={(e) => setAbaloneQty(e.target.value)} /></div>
                                        <button onClick={() => handleAddToCart('หอยเป๋าฮื้อสด', '1kg', abaloneDelivery, abaloneQty, 'กก.', stockAbalone)} disabled={stockAbalone <= 0} style={stockAbalone <= 0 ? disabledBtnStyle : {}}>{stockAbalone <= 0 ? '❌ สินค้าหมด' : 'ใส่ตะกร้า (฿2,200/กก.)'}</button>
                                    </div>

                                        <div style={{ display: 'flex', justifyContent: 'space-between' }}><h3>ปูจั๊กจั่นสด</h3> <span style={{ color: stockFrogCrab > 0 ? '#26dec0' : '#ec4899', fontWeight: 'bold' }}>เหลือ: {stockFrogCrab} กก.</span></div>
                                        <div className="form-group"><label>ขนาด:</label><select disabled><option>1 กิโลกรัม (฿650)</option></select></div>
                                        <div className="form-group"><label>จัดส่ง:</label><select value={frogCrabDelivery} onChange={(e) => setFrogCrabDelivery(e.target.value)}><option value="น็อคน้ำแข็ง (แบบแช่แข็ง)">น็อคน้ำแข็ง (แบบแช่แข็ง)</option></select></div>
                                        <div className="form-group"><label>จำนวน (กก.):</label><input type="number" min="1" max={stockFrogCrab} value={frogCrabQty} onChange={(e) => setFrogCrabQty(e.target.value)} /></div>
                                        <button onClick={() => handleAddToCart('ปูจั๊กจั่น', '1kg', frogCrabDelivery, frogCrabQty, 'กก.', stockFrogCrab)} disabled={stockFrogCrab <= 0} style={stockFrogCrab <= 0 ? disabledBtnStyle : {}}>{stockFrogCrab <= 0 ? '❌ สินค้าหมด' : 'ใส่ตะกร้า (฿650/กก.)'}</button>
                                    </div>

                                    {/* 👑 18. ปลาเก๋ายักษ์ 2 ขนาดใหม่พิเศษ */}

                                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>

                                            <span style={{ color: stockGiantGrouper > 0 ? '#ffd700' : '#ec4899', fontWeight: 'bold' }}>เหลือ: {stockGiantGrouper} ตัว</span>

                                            </select>
                                        </div>
                                        <div className="form-group"><label style={{ color: '#ffd700' }}>การจัดส่งพิเศษ:</label><select value={giantGrouperDelivery} onChange={(e) => setGiantGrouperDelivery(e.target.value)}><option value="รถออกซิเจนพิเศษ (แบบเป็นๆ)">รถออกซิเจนคุมอุณหภูมิพิเศษ (เป็นๆ)</option></select></div>
                                        <div className="form-group"><label style={{ color: '#ffd700' }}>จำนวน (ตัว):</label><input type="number" min="1" max={stockGiantGrouper} value={giantGrouperQty} onChange={(e) => setGiantGrouperQty(e.target.value)} /></div>
                                        <button onClick={() => handleAddToCart('ปลาเก๋ายักษ์', giantGrouperSize, giantGrouperDelivery, giantGrouperQty, 'ตัว', stockGiantGrouper)} disabled={stockGiantGrouper <= 0} className="btn-special" style={stockGiantGrouper <= 0 ? disabledBtnStyle : {}}>{stockGiantGrouper <= 0 ? '❌ สินค้าหมด' : `🛒 สั่งซื้อ (฿${PRICING['ปลาเก๋ายักษ์'][giantGrouperSize].toLocaleString()})`}</button>
                                    </div>

                                </div>
                            </div>

                        {/* ================= 2. เมนูอาหารร้าน & บุฟเฟต์ ================= */}
                        {activeTab === 'menus' && (

                                {/* Section บุฟเฟต์ */}
                                <div className="tracking-box" style={{ background: 'linear-gradient(135deg, #131823 0%, #1f2937 100%)', border: '2px solid #ff6b6b', marginBottom: '40px' }}>
                                    <h2 style={{ color: '#ffd700', marginTop: 0, fontSize: '1.8rem', textAlign: 'center' }}>🔥 เมนูบุฟเฟต์ทะเลเผา 699 บาท/ท่าน</h2>
                                    <p style={{ color: '#e2e8f0', textAlign: 'center', fontSize: '1.1rem' }}>เวลา 120 นาที - รวมไม่อั้น</p>
                                    
                                    <div className="buffet-list">
                                        <div className="buffet-box">
                                            <h3 style={{ color: '#26dec0', marginTop: 0, borderBottom: '1px solid #26dec0', paddingBottom: '10px' }}>🦀 เมนูซีฟู้ดหลัก</h3>
                                            <ul>
                                                <li>🦐 กุ้งก้ามกราม (ไซซ์ 8-10 ตัว/กก.)</li>
                                                <li>🦀 ปูดำ (ไซซ์ 4 ตัว/กก.)</li>
                                                <li>🦀 ปูม้า, ปูจั๊กจั่น, แมงดาทะเล</li>
                                                <li>🦐 กุ้งแชบ๊วย, 🦑 ปลาหมึก</li>
                                                <li>🐟 ปลาแซลมอน, 🐚 หอยเชลล์</li>
                                                <li>🦪 หอยนางรมสด, 🐚 หอยแครง</li>
                                            </ul>
                                        </div>
                                        <div className="buffet-box">
                                            <h3 style={{ color: '#ffd700', marginTop: 0, borderBottom: '1px solid #ffd700', paddingBottom: '10px' }}>🥗 เครื่องเคียง & น้ำจิ้ม (ฟรี)</h3>
                                            <ul style={{ listStyleType: 'none', paddingLeft: 0 }}>
                                                <li style={{ color: '#ff6b6b', fontWeight: 'bold', marginBottom: '10px' }}>น้ำจิ้มซีฟู้ด / แจ่ว / สุกี้</li>
                                                <li>🍚 ข้าวสวย / ข้าวผัดกระเทียม</li>
                                                <li>🥬 ผักสด / 🌽 ข้าวโพด / 🍄 เห็ด</li>
                                                <li>🧊 น้ำแข็ง / 🍉 ผลไม้ตามฤดูกาล</li>
                                            </ul>
                                        </div>
                                        <div className="buffet-box" style={{ background: 'rgba(255, 107, 107, 0.1)', border: '1px dashed #ff6b6b' }}>
                                            <h3 style={{ color: '#ff6b6b', marginTop: 0, borderBottom: '1px solid #ff6b6b', paddingBottom: '10px' }}>👑 เมนูเสริมพรีเมียม (สั่งเพิ่ม)</h3>
                                            <ul style={{ listStyleType: 'none', paddingLeft: 0 }}>
                                                <li>🦞 กุ้งมังกร (2,590 บาท)</li>
                                                <li>🦀 ปูทาราบะ (1,990 บาท)</li>
                                                <li>🐚 หอยเป๋าฮื้อ (690 บาท)</li>
                                            </ul>
                                        </div>
                                    </div>
                                    <div style={{ textAlign: 'center', marginTop: '25px' }}>
                                        <div style={{ maxWidth: '300px', margin: '0 auto' }}>
                                            <div className="form-group" style={{ textAlign: 'left' }}><label>จำนวนท่าน:</label><input type="number" min="1" value={buffetQty} onChange={e => setBuffetQty(e.target.value)} /></div>
                                            <button onClick={handleAddBuffet} style={{ background: '#ff6b6b', color: '#fff', border: 'none', fontSize: '1.2rem', padding: '15px' }}>🔥 จองแพ็กเกจบุฟเฟต์</button>
                                        </div>
                                    </div>
                                </div>

                                {/* Section เมนู A La Carte */}
                                <h2 style={{ color: '#26dec0', borderBottom: '2px solid #26dec0', paddingBottom: '10px' }}>🦞 เมนูซีฟู้ดพรีเมียม (A La Carte)</h2>
                                <div className="shop-grid">
                                    {Object.entries(RESTAURANT_MENU).map(([name, item]) => {
                                        const selectedSize = restSelections[name]?.size || Object.keys(item.sizes)[0];
                                        const selectedOption = restSelections[name]?.option || (item.options ? Object.keys(item.options)[0] : '');
                                        const qty = restSelections[name]?.qty || 1;
                                        
                                        const basePrice = item.sizes[selectedSize];
                                        const extraPrice = item.options && selectedOption ? item.options[selectedOption] : 0;
                                        const currentPrice = basePrice + extraPrice;

                                        return (
                                            <div className="product-card" key={name}>
                                                <h3>{name}</h3>
                                                <p style={{ color: '#26dec0', fontWeight: 'bold', fontSize: '1.3rem', margin: '10px 0' }}>฿{currentPrice.toLocaleString()}</p>
                                                
                                                <div className="form-group">
                                                    <label>ขนาด / น้ำหนัก:</label>
                                                    <select value={selectedSize} onChange={e => updateRestSelection(name, 'size', e.target.value)}>
                                                        {Object.entries(item.sizes).map(([sName, sPrice]) => <option key={sName} value={sName}>{sName} (฿{sPrice})</option>)}
                                                    </select>
                                                </div>
                                                
                                                {item.options && (
                                                    <div className="form-group">
                                                        <label>วิธีทำ / เมนู:</label>
                                                        <select value={selectedOption} onChange={e => updateRestSelection(name, 'option', e.target.value)}>
                                                            {Object.entries(item.options).map(([oName, oPrice]) => <option key={oName} value={oName}>{oName}</option>)}
                                                        </select>
                                                    </div>
                                                )}
                                                
                                                <div className="form-group"><label>จำนวนจาน/ชุด:</label><input type="number" min="1" value={qty} onChange={e => updateRestSelection(name, 'qty', e.target.value)} /></div>
                                                <button onClick={() => handleAddRestToCart(name, item)}>🛒 สั่งอาหาร</button>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {/* ================= 3. จองโต๊ะริมทะเล (ต้อง Login ก่อน) ================= */}
                        {activeTab === 'booking' && !isLoggedIn && (

                                <div className="login-box">
                                    <h2 style={{ color: '#26dec0', marginTop: 0 }}>เข้าสู่ระบบเพื่อจองโต๊ะริมทะเล</h2>
                                    <form onSubmit={handleLogin}>
                                        <div className="form-group" style={{ textAlign: 'left' }}><label>ชื่อผู้ใช้งาน:</label><input type="text" value={username} onChange={e => setUsername(e.target.value)} required /></div>
                                        <div className="form-group" style={{ textAlign: 'left' }}><label>รหัสผ่าน:</label><input type="password" value={password} onChange={e => setPassword(e.target.value)} required /></div>
                                        <button type="submit" style={{ background: '#26dec0', color: '#000', marginTop: '10px' }}>🚀 เข้าสู่ระบบ</button>
                                    </form>
                                </div>
                            </div>
                        )}

                        {activeTab === 'booking' && isLoggedIn && (
                            <div className="section">
                                <h1 className="header-title">🪑 จองโต๊ะริมทะเล (20 โต๊ะ, นั่งได้ 10 คน / โต๊ะละ 1,500 บาท)</h1>
                                <div className="tracking-box" style={{ marginBottom: '30px' }}>
                                    <h3 style={{ marginTop: 0, color: '#26dec0' }}>ผังเลือกโต๊ะริมทะเล</h3>
                                    <div className="table-grid">
                                        {tables.map(table => (
                                            <div key={table.id} className={`table-item ${table.status} ${selectedTable?.id === table.id ? 'selected' : ''}`} onClick={() => table.status === 'available' && setSelectedTable(table)}>
                                                <div style={{ fontWeight: 'bold', fontSize: '1.1rem' }}>โต๊ะ {table.id}</div>
                                                <div style={{ fontSize: '0.8rem', color: '#8b949e', margin: '5px 0' }}>นั่งได้ {table.capacity} คน</div>
                                                <div>{table.status === 'available' ? <span className="badge badge-success">ว่าง</span> : <span className="badge badge-warning">จองแล้ว</span>}</div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {selectedTable && (
                                    <div className="product-card" style={{ border: '2px solid #26dec0' }}>
                                        <h3 style={{ color: '#26dec0', marginTop: 0 }}>📝 ยืนยันการจอง: {selectedTable.name}</h3>
                                        <p>ราคาค่าจองโต๊ะ: <b>฿1,500</b> (นั่งได้สูงสุด 10 ท่าน บรรยากาศริมทะเล)</p>
                                        <div className="form-group"><label>ชื่อผู้จอง:</label><input type="text" placeholder="ระบุชื่อ..." value={reservationName} onChange={e => setReservationName(e.target.value)} /></div>
                                        <div className="form-group"><label>วันที่เข้าใช้บริการ:</label><input type="date" value={reservationDate} onChange={e => setReservationDate(e.target.value)} /></div>
                                        <button onClick={handleBookTable} style={{ background: '#26dec0', color: '#000' }}>✅ ยืนยันการจองโต๊ะ (฿1,500)</button>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* ================= 4. ตะกร้า & Checkout ================= */}
                        {activeTab === 'cart' && (
                            <div className="section">
                                <h1 className="header-title">🛍️ ตะกร้าสินค้าและอาหารของคุณ</h1>
                                <div className="tracking-box" style={{ maxWidth: '100%' }}>
                                    {cart.length === 0 ? <p style={{textAlign:'center', color:'#8b949e'}}>ไม่มีสินค้าในตะกร้า</p> : (
                                        <>
                                            <table>
                                                <thead><tr><th>รายการ</th><th>ราคาต่อหน่วย</th><th>จำนวน</th><th>รวม (บาท)</th><th>จัดการ</th></tr></thead>
                                                <tbody>
                                                    {cart.map(item => (
                                                        <tr key={item.id}>
                                                            <td>{item.product}</td>
                                                            <td>฿{item.pricePerUnit.toLocaleString()}</td>
                                                            <td>{item.qty} {item.unit}</td>
                                                            <td style={{color:'#26dec0', fontWeight:'bold'}}>฿{item.total.toLocaleString()}</td>
                                                            <td><button onClick={() => handleRemoveFromCart(item.id)} style={{background:'transparent', color:'#ff6b6b', border:'1px solid #ff6b6b', margin:0, padding:'5px 10px', width:'auto'}}>ลบ</button></td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                            <h2 style={{color:'#26dec0', textAlign:'right', marginTop:'20px'}}>ยอดรวมทั้งสิ้น: ฿{cartTotalAmount.toLocaleString()}</h2>
                                            <button onClick={() => setActiveTab('checkout')} style={{background:'#26dec0', color:'#000', fontSize:'1.2rem', padding:'15px'}}>👉 ดำเนินการชำระเงิน</button>
                                        </>
                                    )}
                                </div>
                            </div>
                        )}

                        {activeTab === 'checkout' && (
                            <div className="section">
                                <h1 className="header-title">💳 ชำระเงินค่าอาหารและบริการ</h1>
                                <div className="shop-grid">
                                    <div className="product-card" style={{ gridColumn: '1 / -1' }}>
                                        <h3>สรุปยอดชำระ</h3>
                                        <div style={{ display: 'flex', gap: '10px', margin: '15px 0' }}>
                                            <input type="text" placeholder="กรอกโค้ดส่วนลด (เช่น MEGA99)" value={promoCodeInput} onChange={(e) => setPromoCodeInput(e.target.value)} style={{ flex: 1 }}/>
                                            <button onClick={applyPromoCode} style={{ width: 'auto', margin: 0 }}>ใช้โค้ด</button>
                                        </div>
                                        {discountPercent > 0 && <p style={{color:'#f53844', textAlign:'right'}}>ส่วนลด ({discountPercent}%): -฿{discountAmount.toLocaleString()}</p>}
                                        <h2 style={{color:'#26dec0', textAlign:'right'}}>ยอดสุทธิ: ฿{finalTotalAmount.toLocaleString()}</h2>
                                    </div>
                                    <div className="product-card">
                                        <h3>ข้อมูลผู้ติดต่อ</h3>

                                        <div className="form-group"><label>เบอร์โทร:</label><input type="text" value={customerPhone} onChange={e => setCustomerPhone(e.target.value)} /></div>
                                    </div>
                                    <div className="product-card">
                                        <h3>ช่องทางชำระเงิน</h3>
                                        <select value={paymentMethod} onChange={e => setPaymentMethod(e.target.value)}>
                                            <option value="cod">ชำระเงินสดที่ร้าน</option>
                                            <option value="bank">โอนผ่านธนาคาร</option>
                                        </select>
                                        <button onClick={handleConfirmOrder} style={{ background: '#26dec0', color: '#000', marginTop: '20px' }}>✅ ยืนยันการสั่งซื้อ</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* ================= 5. บันทึกสต็อก (Records) ================= */}
                        {activeTab === 'records' && (
                            <div className="section">
                                <h1 className="header-title">📝 บันทึกสต็อก: นำเข้า และ ขายออก</h1>
                                <div className="dashboard-cards">
                                    <div className="card bg-green"><h3>นำเข้าทั้งหมด</h3><p>{totalImported.toLocaleString()}</p></div>
                                    <div className="card bg-orange"><h3>ขายออกทั้งหมด</h3><p>{totalSoldQty.toLocaleString()}</p></div>
                                    <div className="card bg-blue"><h3>ยอดขายรวม</h3><p>฿{totalRevenue.toLocaleString()}</p></div>
                                </div>
                                <div className="tracking-box">
                                    <h3 style={{marginTop: 0}}>ฟอร์มบันทึก</h3>
                                    <select value={recordType} onChange={e => setRecordType(e.target.value)} style={{marginBottom:'15px'}}>
                                        <option value="in">📥 นำเข้า (IN)</option>
                                        <option value="out">📤 ขายออก (OUT)</option>
                                    </select>
                                    <select value={recordProduct} onChange={e => setRecordProduct(e.target.value)} style={{marginBottom:'15px'}}>
                                        <option value="กุ้งก้ามกราม">กุ้งก้ามกราม</option>
                                        <option value="ปูดำ/ปูทะเล">ปูดำ/ปูทะเล</option>
                                        <option value="กุ้งมังกร">กุ้งมังกร</option>
                                        <option value="ปลากระพงขาว">ปลากระพงขาว</option>
                                        <option value="หอยเชลล์">หอยเชลล์</option>
                                        <option value="หอยแครง">หอยแครง</option>
                                        <option value="ปลาหมึกกล้วย">ปลาหมึกกล้วย</option>
                                        <option value="ปูม้า">ปูม้า</option>
                                        <option value="หอยนางรมสุราษฎร์">หอยนางรมสุราษฎร์</option>
                                        <option value="กุ้งแชบ๊วย">กุ้งแชบ๊วย</option>
                                        <option value="แมงดาทะเลไข่">แมงดาทะเลไข่</option>
                                        <option value="ปลาแซลมอน">ปลาแซลมอน</option>
                                        <option value="ปูทาราบะ">ปูทาราบะ</option>
                                        <option value="กุ้งมังกรเจ็ดสี">กุ้งมังกรเจ็ดสี</option>
                                        <option value="ปลาหิมะ">ปลาหิมะ</option>
                                        <option value="หอยเป๋าฮื้อสด">หอยเป๋าฮื้อสด</option>
                                        <option value="ปูจั๊กจั่น">ปูจั๊กจั่น</option>
                                        <option value="ปลาเก๋ายักษ์">ปลาเก๋ายักษ์</option>
                                    </select>
                                    <input type="number" placeholder="จำนวน" value={recordQty} onChange={e => setRecordQty(e.target.value)} style={{marginBottom:'15px'}}/>
                                    {recordType === 'out' && <input type="number" placeholder="ราคาขายรวม" value={recordPrice} onChange={e => setRecordPrice(e.target.value)} style={{marginBottom:'15px'}}/>}
                                    <button onClick={handleSaveRecord}>บันทึกข้อมูล</button>
                                </div>

                                <h3 style={{marginTop: '40px'}}>ประวัติการทำรายการล่าสุด</h3>
                                <table>
                                    <thead><tr><th>วันที่</th><th>ประเภท</th><th>สินค้า</th><th>จำนวน</th><th>ยอดเงิน (บาท)</th></tr></thead>
                                    <tbody>
                                        {recordsList.length === 0 ? <tr><td colSpan="5" style={{ textAlign: 'center' }}>ยังไม่มีข้อมูลการบันทึก</td></tr> : recordsList.slice(0).reverse().map((record) => (
                                            <tr key={record.id}>
                                                <td>{record.date}</td>
                                                <td>{record.type === 'in' ? <span className="badge badge-success">📥 นำเข้า</span> : <span className="badge badge-warning">📤 ขายออก</span>}</td>
                                                <td>{record.product}</td>
                                                <td>{record.qty}</td>
                                                <td style={{ color: record.type === 'out' ? '#26dec0' : '#e2e8f0' }}>{record.price !== '-' ? `฿${Number(record.price).toLocaleString()}` : '-'}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}

                        {/* ================= 6. วิเคราะห์ & สถิติ (Analytics) ================= */}
                        {activeTab === 'analytics' && (
                            <div className="section">
                                <h1 className="header-title">📊 วิเคราะห์ข้อมูล & สถิติผู้ใช้งาน</h1>
                                <div className="dashboard-cards">
                                    <div className="card bg-green"><h3>🏆 ยอดขายปังสุด</h3><p style={{fontSize: '1.4rem'}}>{mostSoldProduct[0]}</p><span>ยอดขาย: {mostSoldProduct[1]} หน่วย</span></div>
                                    <div className="card bg-pink"><h3>⚠️ ยอดขายน้อยสุด</h3><p style={{fontSize: '1.4rem'}}>{leastSoldProduct[0]}</p><span>ยอดขาย: {leastSoldProduct[1]} หน่วย</span></div>
                                    <div className="card bg-blue"><h3>⏳ รอบเก็บข้อมูล</h3><p style={{fontSize: '1.8rem'}}>{dataRetentionDays} วัน</p><span>รอบการจัดเก็บ (2 เดือน)</span></div>
                                </div>
                                <div className="tracking-box">
                                    <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
                                        <h3 style={{margin: 0}}>📈 กราฟผู้ใช้งานรายวัน</h3>
                                        <button onClick={handleResetAnalytics} style={{width: 'auto', background: 'rgba(236, 72, 153, 0.1)', color: '#ec4899', border: '1px solid #ec4899', margin: 0, padding: '8px 15px'}}>🔄 รีเซ็ตข้อมูลรอบใหม่</button>
                                    </div>
                                    <div className="chart-container">
                                        {dailyUsers.map((item, index) => {
                                            const barHeight = (item.users / 600) * 100;
                                            return (
                                                <div className="chart-bar-wrapper" key={index}>
                                                    <span style={{fontSize: '0.75rem', color: '#26dec0', marginBottom: '5px'}}>{item.users}</span>
                                                    <div className="chart-bar" style={{height: `${Math.max(barHeight, 5)}%`}}></div>
                                                    <div className="chart-label">{item.day}</div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* ================= 7. รีวิว & เรตติ้ง (Reviews) ================= */}
                        {activeTab === 'reviews' && (
                            <div className="section">
                                <h1 className="header-title">⭐ คำติชมจากลูกค้า และคะแนน (1-5 ดาว)</h1>
                                <div className="shop-grid" style={{gridTemplateColumns: '1fr 1.5fr', gap: '30px'}}>
                                    <div className="product-card" style={{margin: 0}}>
                                        <h3 style={{marginTop: 0}}>เขียนรีวิว</h3>
                                        <form onSubmit={handleAddReview}>
                                            <div className="form-group"><label>ชื่อของคุณ:</label><input type="text" value={newReviewName} onChange={e => setNewReviewName(e.target.value)} required /></div>
                                            <div className="form-group"><label>ให้คะแนน:</label>
                                                <select value={newReviewRating} onChange={e => setNewReviewRating(e.target.value)}>
                                                    <option value="5">⭐⭐⭐⭐⭐ (5 ดาว)</option><option value="4">⭐⭐⭐⭐ (4 ดาว)</option>
                                                    <option value="3">⭐⭐⭐ (3 ดาว)</option><option value="2">⭐⭐ (2 ดาว)</option><option value="1">⭐ (1 ดาว)</option>
                                                </select>
                                            </div>
                                            <div className="form-group"><label>ความคิดเห็น:</label><textarea rows="4" value={newReviewComment} onChange={e => setNewReviewComment(e.target.value)} required></textarea></div>
                                            <button type="submit" style={{background: '#26dec0', color: '#000'}}>📤 ส่งรีวิว</button>
                                        </form>
                                    </div>
                                    <div className="tracking-box" style={{margin: 0}}>
                                        <h3 style={{marginTop: 0}}>รายการรีวิว ({reviews.length})</h3>
                                        <div style={{display: 'flex', flexDirection: 'column', gap: '15px', maxHeight: '450px', overflowY: 'auto'}}>
                                            {reviews.map(rev => (
                                                <div key={rev.id} style={{background: 'rgba(255,255,255,0.02)', border: '1px solid var(--border-color)', borderRadius: '10px', padding: '15px'}}>
                                                    <div style={{display: 'flex', justifyContent: 'space-between', marginBottom: '8px'}}><strong style={{color: '#26dec0'}}>{rev.name}</strong><span style={{color: '#8b949e', fontSize: '0.85rem'}}>{rev.date}</span></div>
                                                    <div style={{color: '#ffd700', marginBottom: '8px'}}>{'⭐'.repeat(rev.rating)}</div>
                                                    <p style={{margin: 0, color: '#e2e8f0'}}>{rev.comment}</p>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* ================= 8. เช็คคำสั่งซื้อ (Orders) ================= */}
                        {activeTab === 'orders' && (
                            <div className="section">
                                <h1 className="header-title">📦 แดชบอร์ดคำสั่งซื้อ</h1>
                                <div className="dashboard-cards">
                                    <div className="card bg-green"><h3>ออเดอร์ทั้งหมด</h3><p>45 รายการ</p></div>
                                    <div className="card bg-orange"><h3>รอแพ็ค (แบบเป็นๆ)</h3><p>430 กก.</p></div>
                                    <div className="card bg-blue"><h3>รอแพ็ค (แช่แข็ง)</h3><p>820 กก.</p></div>
                                    <div className="card bg-pink"><h3>รอดำเนินการจัดส่ง</h3><p>15 ออเดอร์</p></div>
                                </div>
                                <h3>รายการออเดอร์ล่าสุด</h3>
                                <table>
                                    <thead><tr><th>รหัสคำสั่งซื้อ</th><th>ลูกค้า</th><th>ยอดรวม</th><th>สถานะ</th></tr></thead>
                                    <tbody>
                                        <tr><td>ORD-001</td><td>คุณ สมชาย</td><td>฿2,500</td><td><span className="badge badge-warning">รอจัดเตรียม</span></td></tr>
                                        <tr><td>ORD-002</td><td>คุณ สมหญิง</td><td>฿14,500</td><td><span className="badge badge-success">พร้อมส่ง</span></td></tr>
                                        <tr><td>ORD-003</td><td>บจก. ซีฟู้ดไทย</td><td>฿351,000</td><td><span className="badge badge-info">กำลังจัดส่ง</span></td></tr>
                                    </tbody>
                                </table>
                            </div>
                        )}

                        {/* ================= 9. เช็คสถานะการขนส่ง (Tracking) ================= */}
                        {activeTab === 'tracking' && (
                            <div className="section">
                                <h1 className="header-title">🚚 ระบบติดตามการขนส่ง (Tracking)</h1>
                                <div className="tracking-box">
                                    <div className="form-group">
                                        <label>กรอกรหัสพัสดุ หรือ เลขคำสั่งซื้อ:</label>
                                        <input type="text" placeholder="เช่น ORD-001" value={trackId} onChange={e => setTrackId(e.target.value)} />
                                    </div>
                                    <button onClick={handleTrackOrder}>ตรวจสอบสถานะพัสดุ</button>
                                    
                                    {trackingStatus && (
                                        <div style={{ marginTop: '30px', padding: '20px', background: 'rgba(38, 222, 192, 0.05)', borderRadius: '12px', border: '1px solid #26dec0' }}>
                                            <h3 style={{ color: '#26dec0', marginTop: 0, borderBottom: '1px dashed #263040', paddingBottom: '10px' }}>สถานะพัสดุ: {trackId}</h3>
                                            <ul style={{ listStyle: 'none', padding: 0, margin: 0, position: 'relative' }}>
                                                <li style={{ paddingLeft: '25px', borderLeft: '2px solid #26dec0', paddingBottom: '20px', position: 'relative' }}>
                                                    <span style={{ position: 'absolute', left: '-7px', top: '0', width: '12px', height: '12px', background: '#26dec0', borderRadius: '50%', boxShadow: '0 0 10px #26dec0' }}></span>
                                                    <div style={{ color: '#fff', fontWeight: 'bold' }}>จัดส่งออกจากฟาร์ม/ร้านแล้ว</div>
                                                    <div style={{ fontSize: '0.85rem', color: '#8b949e', marginTop: '5px' }}>รถควบคุมอุณหภูมิห้องเย็น 4°C (ซีฟู้ดสดใหม่เสมอ)</div>
                                                </li>
                                                <li style={{ paddingLeft: '25px', borderLeft: '2px solid #263040', paddingBottom: '20px', position: 'relative' }}>
                                                    <span style={{ position: 'absolute', left: '-7px', top: '0', width: '12px', height: '12px', background: '#263040', borderRadius: '50%' }}></span>
                                                    <div style={{ color: '#8b949e' }}>กำลังนำส่งถึงปลายทาง</div>
                                                </li>
                                                <li style={{ paddingLeft: '25px', position: 'relative' }}>
                                                    <span style={{ position: 'absolute', left: '-7px', top: '0', width: '12px', height: '12px', background: '#263040', borderRadius: '50%' }}></span>
                                                    <div style={{ color: '#8b949e' }}>พัสดุจัดส่งสำเร็จ</div>
                                                </li>
                                            </ul>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* ================= 10. Admin จัดการโต๊ะ ================= */}
                        {activeTab === 'admin' && userRole === 'admin' && (
                            <div className="section">
                                <h1 className="header-title">👑 แอดมิน: จัดการโต๊ะริมทะเล</h1>
                                <table>
                                    <thead><tr><th>โต๊ะ</th><th>ความจุ</th><th>สถานะ</th><th>ผู้จอง</th></tr></thead>
                                    <tbody>
                                        {tables.map(t => (
                                            <tr key={t.id}><td>{t.name}</td><td>{t.capacity} คน</td><td>{t.status === 'available' ? <span className="badge badge-success">ว่าง</span> : <span className="badge badge-warning">จองแล้ว</span>}</td><td>{t.reservedBy || '-'}</td></tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
